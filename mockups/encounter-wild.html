<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rencontre Sauvage - Pokémon App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <!-- LAYOUT START -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-nintendo-switch"></i> Dresseurs & Captures
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="trainer-index.html">
                            <i class="bi bi-person-badge"></i> Dresseurs
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- LAYOUT END -->

    <div class="container">
        <div class="text-center mb-4">
            <h1 class="display-4"><i class="bi bi-exclamation-diamond-fill text-warning"></i> Un Salamèche sauvage apparaît !</h1>
        </div>

        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card border-warning shadow-lg">
                    <div class="card-body text-center">
                        <div class="pokeball-large"></div>

                        <img src="img/salameche.svg" alt="Salamèche" style="width: 200px; height: 200px; margin: 20px 0;">

                        <h2 class="mb-3">Salamèche</h2>

                        <div class="mb-3">
                            <span class="type-badge type-fire" style="font-size: 1.1rem;">Feu</span>
                        </div>

                        <div class="stats-section">
                            <div class="stat-item">
                                <span class="stat-label"><i class="bi bi-heart-fill text-danger"></i> Points de Vie</span>
                                <span class="stat-value">39</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label"><i class="bi bi-shield-fill text-primary"></i> Défense</span>
                                <span class="stat-value">43</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label"><i class="bi bi-lightning-fill text-warning"></i> Attaque</span>
                                <span class="stat-value">52</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="bi bi-cursor-fill"></i> Action</h4>
                    </div>
                    <div class="card-body">
                        <form method="post" action="">
                            <input type="hidden" name="trainerId" value="1">
                            <input type="hidden" name="pokemonId" value="4">

                            <div class="mb-4">
                                <label for="Ball" class="form-label">
                                    <strong><i class="bi bi-circle"></i> Choisissez votre Poké Ball</strong>
                                </label>
                                <select class="form-select form-select-lg" id="Ball" name="Ball" required>
                                    <option value="" selected disabled>-- Sélectionnez une balle --</option>
                                    <option value="PokeBall">🔴 Poké Ball (Taux de capture : 50%)</option>
                                    <option value="SuperBall">🔵 Super Ball (Taux de capture : 75%)</option>
                                    <option value="MasterBall">🟣 Master Ball (Taux de capture : 100%)</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="bi bi-bullseye"></i> Lancer la balle !
                                </button>
                                <a href="trainer-details.html" class="btn btn-danger btn-lg">
                                    <i class="bi bi-dash-circle"></i> Fuir
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYOUT START -->
    <footer>
        <p class="mb-0">&copy; 2026 Dresseurs & Captures - Formation .NET MVC</p>
    </footer>
    <!-- LAYOUT END -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
