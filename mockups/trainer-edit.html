<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Dresseur - Pokémon App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <!-- LAYOUT START -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-nintendo-switch"></i> Dresseurs & Captures
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="trainer-index.html">
                            <i class="bi bi-person-badge"></i> Dresseurs
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- LAYOUT END -->

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-pencil-square"></i> Modifier le Dresseur</h1>
            <a href="trainer-index.html" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Informations du dresseur</h4>
            </div>
            <div class="card-body">
                <!-- PARTIAL: _TrainerForm -->
                <form method="post" action="">
                    <input type="hidden" name="Id" value="1">

                    <div class="mb-3">
                        <label for="Name" class="form-label">
                            <i class="bi bi-person"></i> Nom <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="Name" name="Name" value="Sacha" required>
                        <span class="text-danger"></span>
                    </div>

                    <div class="mb-3">
                        <label for="Town" class="form-label">
                            <i class="bi bi-geo-alt"></i> Ville <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="Town" name="Town" value="Bourg Palette" required>
                        <span class="text-danger"></span>
                    </div>

                    <div class="mb-3">
                        <label for="BadgeCount" class="form-label">
                            <i class="bi bi-award"></i> Nombre de badges <span class="text-danger">*</span>
                        </label>
                        <input type="number" class="form-control" id="BadgeCount" name="BadgeCount" min="0" max="8" value="8" required>
                        <small class="form-text text-muted">Entre 0 et 8 badges</small>
                        <span class="text-danger"></span>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-circle"></i> Enregistrer
                        </button>
                        <a href="trainer-index.html" class="btn btn-secondary btn-lg">
                            <i class="bi bi-x-circle"></i> Annuler
                        </a>
                    </div>
                </form>
                <!-- PARTIAL: _TrainerForm -->
            </div>
        </div>
    </div>

    <!-- LAYOUT START -->
    <footer>
        <p class="mb-0">&copy; 2026 Dresseurs & Captures - Formation .NET MVC</p>
    </footer>
    <!-- LAYOUT END -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
